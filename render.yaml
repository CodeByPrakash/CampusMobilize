services:
  - type: web
    name: campusiq-ml-backend
    env: python
    region: singapore
    plan: free
    rootDir: ML
    buildCommand: pip install -r requirements.txt && python run_pipeline.py
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: ENVIRONMENT
        value: production
